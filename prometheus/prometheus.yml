global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-gateway:8000']

  - job_name: 'ml-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-service:8001']
